<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento cancelado — Plataforma Sapiens</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0a1628;color:#e8f4f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#0f2035;border:1px solid #1a3a50;border-radius:16px;padding:2.5rem;max-width:420px;width:90%;text-align:center}
.icon{font-size:3rem;margin-bottom:1rem}
h1{font-family:'Syne',sans-serif;font-size:1.5rem;margin-bottom:.5rem;color:#e74c3c}
p{font-size:.9rem;color:#7a9e90;line-height:1.6;margin-bottom:1.5rem}
.btn{display:inline-block;background:#00e5a0;color:#0a1628;padding:.7rem 2rem;border-radius:8px;text-decoration:none;font-weight:600;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
  <div class="icon">😕</div>
  <h1>Pagamento cancelado</h1>
  <p>Não se preocupe — nenhuma cobrança foi feita. Você pode tentar novamente quando quiser.</p>
  <a href="/" class="btn">Voltar ao site</a>
</div>
</body>
</html>
